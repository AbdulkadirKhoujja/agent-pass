[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentpass-demo"
version = "0.1.0"
description = "Offline AgentPass discovery, permissions and receipt proof of concept"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
readme = "README.md"
authors = [{name = "AgentPass contributors"}]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.scripts]
agentpass-demo = "agentpass.__main__:main"

[tool.setuptools.packages.find]
include = ["agentpass*"]

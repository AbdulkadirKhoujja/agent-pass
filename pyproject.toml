[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mandovyn-demo"
version = "0.1.0"
description = "Offline Mandovyn discovery, permissions and receipt proof of concept"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
readme = "README.md"
authors = [{name = "Mandovyn contributors"}]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.scripts]
mandovyn-demo = "mandovyn.__main__:main"

[tool.setuptools.packages.find]
include = ["mandovyn*"]
